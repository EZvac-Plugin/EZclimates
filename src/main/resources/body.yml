# EZclimates' body temperature: heat and cold that wear down survival players
# caught in the elements (LiveExposure, before it became part of EZclimates).
# Temperatures here are always in F, like EZvac's config; players see F or C,
# following EZvac's own "units" setting.
#
# Each player has a body temperature. It rests at 98.6 F, falls in the cold,
# rises in the heat, and settles back once they're comfortable. How cold or
# hot it feels comes from EZvac ("feels like": humidity, wind, the season, the
# sun on them or the shade they stand in, and whether they're in a heated or
# cooled room), or the water's temperature when they're swimming.

# It is switched in EZvac's Addons menu: /hvac addons, EZclimates, Body
# temperature. on-by-default says what a server that has never switched it
# there gets: off, since it can kill (see lethal). A server that had
# LiveExposure gets its settings brought over, with this on.
# /ezclimates body reload reads this file again.
on-by-default: false

# Heat and cold can kill. false keeps players alive at damage.floor instead.
lethal: true

# Outside this band the body cools or warms; inside it, it recovers.
comfort:
  low-f: 50.0
  high-f: 86.0

rates:
  # Body cooling per minute, for every degree it feels below comfort.low-f:
  # at 20 F that's 30 x 0.068 = about 2 F a minute.
  cold-f-per-minute: 0.068
  # Body warming per minute, for every degree it feels above comfort.high-f.
  heat-f-per-minute: 0.054
  # How fast the body returns to 98.6 F once comfortable.
  recovery-f-per-minute: 0.7
  # Water moves body heat this many times faster than air.
  water-factor: 3.0

# Where the body settles. For every degree it feels past the comfort band,
# the body's balance point moves this far from 98.6 F; the body heads there at
# the rates above and stays. With 0.25, heatstroke (104 F) needs about 108 F
# feels-like, and freezing (below 91 F) about 20 F.
balance:
  heat-f-per-f: 0.25
  cold-f-per-f: 0.25

# Where each stage begins, by body temperature.
stages:
  chilled-below-f: 97.0            # a warning and a little frost
  hypothermia-below-f: 95.0        # Slowness
  severe-hypothermia-below-f: 93.0 # Slowness II, Weakness, Mining Fatigue
  freezing-below-f: 91.0           # and damage
  overheating-above-f: 99.5        # a warning
  heat-exhaustion-above-f: 100.5   # Slowness, hunger
  severe-heat-above-f: 102.0       # Weakness, Mining Fatigue, a wave of Nausea
  heatstroke-above-f: 104.0        # and damage

damage:
  # Damage per hit while freezing or in heatstroke, and the time between hits.
  amount: 1.0
  interval-seconds: 4.0
  # With lethal: false, heat and cold never take a player below this health
  # (1.0 = half a heart).
  floor: 1.0

# Leather armour keeps the cold out: points per piece worn, and how many
# degrees each point is worth. A full set is 10 points = 15 F warmer, only
# against cold.
cold-resistance:
  helmet: 1.5
  chestplate: 3.5
  leggings: 3.5
  boots: 1.5
  f-per-point: 1.5

# Darkness closes in at the deadly stages, freezing and heatstroke, while
# the body is taking damage (EZclimates 0.2.0).
darkness-when-dying: true

# Getting wet (EZclimates 0.2.0). Rain soaks you out in the open, falling
# snow slower and a thunderstorm faster; water soaks you at once. Wet, the
# cold feels colder and takes your heat faster, and the heat a little
# milder. You dry off out of the rain, faster the warmer it is, by a fire
# and in the sun.
wetness:
  enabled: true
  soaked-after-minutes: 3.0   # of rain in the open, from dry
  snow-share: 0.4             # how much of rain's soaking falling snow does
  dry-minutes: 8.0            # from soaked to dry, out of the rain, at 60 F
  colder-by-f: 12.0           # soaked, the cold feels this much colder
  cold-rate-bonus: 1.0        # and takes heat this much faster (1.0: twice as fast)
  milder-heat-by-f: 4.0       # soaked, the heat feels this much milder

# Fires warm you near them (EZclimates 0.2.0), even outdoors in a blizzard:
# each kind's warmth right beside it, fading to nothing at the radius.
# Against the cold a fire warms the air you feel fully, up to comfortable
# (68 F with the stock comfort band): right beside a campfire you're
# comfortable at 0 F, and two blocks off it's mild. Past comfortable, and in
# the heat, only a quarter of its warmth counts, so a fire in the desert is
# a nuisance rather than deadly. Unlit campfires give nothing.
fires:
  enabled: true
  radius: 4
  warmth-f:
    campfire: 60
    soul_campfire: 45
    fire: 45
    soul_fire: 30
    lava: 70
    magma_block: 15
  most-f: 80                  # the most all fires together can add
  # A chilled body warms back up faster by a fire: this much faster per
  # degree of the fire's warmth (0.07: right beside a campfire, about 5
  # times, so from freezing back to normal in about two minutes).
  rewarm-per-f: 0.07

# Food (EZclimates 0.2.0): warm food holds the cold off for a while, like
# leather, and cool food the heat. Each is [degrees F, minutes].
# water_bottle is a water bottle.
food:
  enabled: true
  warm:
    mushroom_stew: [12, 5]
    rabbit_stew: [15, 6]
    beetroot_soup: [12, 5]
    suspicious_stew: [12, 5]
    baked_potato: [6, 2]
    cooked_beef: [5, 2]
    cooked_porkchop: [5, 2]
    cooked_chicken: [5, 2]
    cooked_mutton: [5, 2]
    cooked_rabbit: [5, 2]
    cooked_cod: [4, 2]
    cooked_salmon: [4, 2]
    pumpkin_pie: [4, 2]
  cool:
    melon_slice: [6, 3]
    sweet_berries: [3, 2]
    glow_berries: [3, 2]
    water_bottle: [6, 3]

# Metal armor in direct sun (EZclimates 0.2.0): each iron, chainmail, gold,
# copper, diamond or netherite piece worn adds this much, only toward the
# heat. Leather and no armor stay cool.
armor:
  enabled: true
  sun-f-per-piece: 2.5

# Working hard warms you (EZclimates 0.2.0): sprinting, swimming and mining,
# up to most-f, built up over build-up-seconds and gone cool-down-seconds
# after you stop. A help in the cold, a danger in a heat wave.
exertion:
  enabled: true
  most-f: 8.0
  build-up-seconds: 30.0
  cool-down-seconds: 45.0

# Breath you can see in cold air (EZclimates 0.2.0): a small puff in front
# of the face, about every few seconds, below this air temperature.
breath:
  enabled: true
  below-f: 40.0
  every-seconds: 3.0

# Sleeping cold (EZclimates 0.2.0): a night asleep where you still feel
# cold, with everything worn and eaten counted, wakes you chilled and
# counts as this many minutes out in the cold toward catching a cold.
sleep:
  enabled: true
  counts-as-cold-minutes: 20

# The body temperature on EZvac's climate HUD (/hvac hud), under the season
# line where EZvac's sidebar has its {addons} line. Needs EZvac ALPHA 2.1 or
# newer. On a server whose HUD is the action bar or the boss bar, put
# {section:ezclimates:body} into EZvac's hud format to show it there.
hud:
  enabled: true
  # MiniMessage, laid out like EZvac's own sections. {body} the body
  # temperature, {stage} the stage in its colour, {meter} a gauge drawn like
  # EZvac's feels-like one (coloured cold to hot, the marker at the body's
  # temperature; EZvac BETA 1.0 Pilot 6, a plain bar before), {status} what
  # else is happening, two at most (Fever, Wet, Fire, Fed, Cooled, Armor, Work),
  # {fever} the fever text while ill, {wet} "· Damp", "· Wet" or "· Soaked".
  # A line holding only {status} is left out while there is nothing to say.
  # At most 4 lines, but EZvac's sidebar has room for two besides its own
  # (it holds 15); a section that doesn't fit isn't shown.
  lines:
    - "<aqua>▍<white>Body <white>{body} {stage}"
    - " {meter} {status}"
  # On one line, for action-bar and boss-bar HUDs.
  inline: "<gray>Body <white>{body}</white> {stage} {status}"
  fever: " <gray>(fever)"
  # The meter is empty at cold-f and full at hot-f, so 98.6 F sits mid-way.
  meter:
    cold-f: 91.0
    hot-f: 106.0
  # Normal, chilled, colder than that, overheating, and hotter than that.
  colors:
    normal: "#6ee07a"
    chilled: "#8fd3ff"
    cold: "#5ab0ff"
    warm: "#ffb347"
    hot: "#ff5c5c"

# Sweat: drops falling from around an overheating player's head, more the
# hotter they get. Purely visual.
sweat:
  enabled: true

worlds:
  # Worlds it applies in; empty means every world.
  enabled: []
  # Worlds it never applies in.
  disabled: []

# Game modes it applies in. Creative and spectator players are never affected,
# and nor is anyone with the liveexposure.bypass (kept from LiveExposure) permission.
game-modes: [SURVIVAL, ADVENTURE]

# Players can fall ill. Entirely optional: false switches it off completely
# (existing illnesses pause, and everything else works as before).
sickness:
  enabled: true
  # Every day (EZvac's calendar, or the world's own days without seasons),
  # each player rolls this chance of falling ill, by the season of the day
  # that ended.
  chance:
    spring: 0.03
    summer: 0.01
    autumn: 0.04
    winter: 0.08
    no-seasons: 0.03
  # A day spent cold multiplies the chance, up to this for a whole day cold.
  cold-multiplier: 4.0
  # Time near a sick player adds to the next roll.
  contagion:
    range-blocks: 10.0
    # Contact needed in a day before it counts.
    seconds: 30.0
    # Added to the chance: 0.35 = 35 percentage points.
    bonus: 0.35
  maximum-chance: 0.95
  # How likely each severity is when someone falls ill.
  severity:
    mild: 0.6
    moderate: 0.3
    severe: 0.1
  # How long an illness lasts, in days.
  days:
    minimum: 2
    maximum: 3
  # A fever raises the body's resting temperature...
  fever-f:
    mild: 99.4
    moderate: 100.0
    severe: 100.6
  # ...and makes heat warm the body this many times faster.
  heat-multiplier:
    mild: 1.5
    moderate: 2.0
    severe: 2.5
  # Minutes between waves of nausea.
  nausea-every-minutes:
    mild: 5.0
    moderate: 3.0
    severe: 2.0
  # Drinking a water bottle while sick takes days-per-bottle off the illness,
  # up to maximum-days in all.
  water:
    days-per-bottle: 0.25
    maximum-days: 1.0
  # Logs every daily roll to the console, for tuning.
  log-rolls: false
