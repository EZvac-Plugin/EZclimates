name: EZclimates
version: '${project.version}'
main: com.github.blade.ezclimates.EzClimatesPlugin
bootstrapper: com.github.blade.ezclimates.EzClimatesBootstrap
api-version: '26.1'
author: bladestech
description: Seasons you can see, from EZvac's climate. An addon for EZvac.
website: https://github.com/EZvac-Plugin/EZclimates
dependencies:
  server:
    EZvac:
      load: BEFORE
      required: true
      join-classpath: true
    packetevents:
      load: BEFORE
      required: true
      join-classpath: true
