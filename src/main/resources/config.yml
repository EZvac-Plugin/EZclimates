# EZclimates: seasons you can see, from EZvac's climate (0.1.0).
#
# Rain and snow fall where EZvac's air says, and leaves and grass change
# colour through the year. Only what players are sent changes: the world
# keeps its own biomes, so removing EZclimates leaves nothing behind.
# Needs EZvac BETA 1.0 Pilot 4 or newer, packetevents, and Paper or Purpur
# 26.1 or newer.

# Rain where EZvac says it rains and snow where it snows, by its air: the
# season, the height and the time of day all count, so the plains snow in a
# cold winter and a mountain can snow at the top and rain at its foot.
# EZvac's weather.dry-areas sets whether deserts get rain in thunderstorms.
rain-and-snow: true

# Leaves and grass through the year: fresh in spring, as vanilla in summer,
# yellowing in early autumn, orange-red in late autumn, dull in winter.
# Birch and spruce leaves keep their fixed colours, as in vanilla.
# Changing any of these colours takes a restart: they shape the seasonal
# biomes written at start-up.
colours:
  enabled: true
  # Where each stage pulls leaves (foliage) and grass, and how far (share, 0
  # to 1). Summer is always vanilla.
  foliage:
    spring: { color: '#8cd45a', share: 0.25 }
    autumn_early: { color: '#d2b832', share: 0.55 }
    autumn_late: { color: '#c8562a', share: 0.75 }
    winter: { color: '#8c7a5a', share: 0.6 }
  grass:
    spring: { color: '#7ed050', share: 0.2 }
    autumn_early: { color: '#b4a848', share: 0.35 }
    autumn_late: { color: '#a88c4c', share: 0.5 }
    winter: { color: '#8e8c66', share: 0.55 }
  # How strongly each kind of biome turns, 0 to 1: broadleaf forests most, a
  # jungle barely.
  strength:
    forest: 1.0
    plains: 0.8
    mountain: 0.6
    swamp: 0.6
    cherry: 0.6
    water: 0.7
    savanna: 0.5
    taiga: 0.45
    dry: 0.35
    cold: 0.3
    pale: 0.2
    mushroom: 0.2
    jungle: 0.15

# Snow that settles where EZvac says it snows, on open ground round players,
# and melts layer by layer once EZvac's air is above 34 F. Every block of it
# is recorded in its chunk and only recorded blocks are ever melted, so it
# never stays forever, and a player's own snow and the snow snowy biomes are
# generated with are never touched. Vanilla's own weather snow is stopped,
# so all of it follows EZvac.
snow:
  enabled: true
  # How far round each player snow and ice are placed.
  radius-blocks: 64
  # How deep it gets with longer snowfall, in layers (1 to 8).
  max-layers: 2
  # How fast it settles, and water freezes: 1 is vanilla's pace (each chunk
  # gets a try one tick in 16), 2 twice as fast (0.1 to 20).
  rate: 1.0
  # Grass, ferns, bushes, flowers, petals and leaf litter under it are
  # buried, and grow back where they were when it melts.

# Ice on the surface of still water when EZvac's water temperature there is
# at freezing: 32 F for fresh water, 28 F for the sea. Ponds, lakes, rivers,
# oceans and unheated pools; a heated pool never freezes. It thaws above
# 34 F, back into water. Recorded like snow, so it always melts; the world's
# own ice (frozen oceans, icebergs) is never touched. Never under a boat or
# a swimmer.
ice:
  enabled: true

# The weather: EZclimates plans each seasonal world's weather days ahead and
# drives Minecraft's to match, so weather stations' forecasts come true.
# Fronts bring rain or snow between dry spells, by each season's odds; some
# bring thunder; some winter fronts are snowstorms (heavy snow, a gale, a
# dark sky, no lightning); and heat waves and cold snaps move EZvac's air
# for days, which rooms, HVAC, rain or snow and lakes all feel. Minecraft's
# own random weather is stopped; /weather still works and the plan takes it
# in, and so does sleeping through a storm. /ezclimates weather shows the
# plan. enabled: false leaves Minecraft's weather alone.
weather:
  enabled: true
  # Each season: dry spells between fronts (days), a front's length
  # (in-game hours), and the share of fronts that bring thunder.
  seasons:
    spring: { dry-days: { min: 1.5, max: 3.0 }, front-hours: { min: 6, max: 18 }, thunder: 0.25 }
    summer: { dry-days: { min: 2.0, max: 5.0 }, front-hours: { min: 2, max: 8 }, thunder: 0.55 }
    autumn: { dry-days: { min: 1.5, max: 3.0 }, front-hours: { min: 8, max: 24 }, thunder: 0.15 }
    winter: { dry-days: { min: 2.0, max: 4.0 }, front-hours: { min: 8, max: 30 }, thunder: 0.05 }
  snowstorm:
    # The share of winter's fronts that are snowstorms.
    share-of-winter-fronts: 0.35
    # How much faster snow settles in one, and how dark its sky is (0 to 1).
    snow-rate: 4.0
    sky: 0.7
  # Days well above the season's usual air (heat waves) or below it (cold
  # snaps): the chance one starts on a day, each season; how many days it
  # lasts; and how far it moves the air at its peak, in F.
  heat-wave:
    chance-per-day: { spring: 0.02, summer: 0.06, autumn: 0.02, winter: 0.0 }
    days: { min: 3, max: 6 }
    strength-f: { min: 8, max: 15 }
  cold-snap:
    chance-per-day: { spring: 0.02, summer: 0.0, autumn: 0.02, winter: 0.06 }
    days: { min: 3, max: 6 }
    strength-f: { min: 8, max: 15 }
  # How sure forecasts are. The plan never changes for exact-days (today
  # counts as one); each morning, a day after those may be planned afresh
  # (revise-chance), and the chances a station shows lean toward the
  # season's usual odds by certainty-loss-per-day for each day further out.
  # exact-days: 7 and revise-chance: 0 make every forecast exact.
  forecast:
    exact-days: 2
    revise-chance: 0.3
    certainty-loss-per-day: 0.15

# How much work each tick may do. Snow lines are worked out for the chunks
# round players (snow-lines-per-tick counts chunks, 16 lines each: rain and
# snow meet along EZvac's own wavy edge, 4 blocks at a time); when one changes (rain turning to snow, a new stage), the
# chunks players already have are resent, nearest first. Snow and ice look
# at a few columns round players for new snow and ice, and at a few
# recorded blocks to melt.
budget:
  snow-lines-per-tick: 40
  chunks-resent-per-tick: 12
  blocks-per-tick: 24
  records-per-tick: 64

# To remove EZclimates cleanly: /ezclimates clear melts every recorded block
# of snow and ice in loaded chunks, and in every chunk as it loads, and
# places no more. /ezclimates status says how many are left in loaded
# chunks; /ezclimates resume goes back to normal.
