  salmon: { days: 4, fridge: 4, freezer: 20, into: rotten_flesh }
  cooked_salmon: { days: 6, fridge: 3, freezer: 15, into: rotten_flesh }
  tropical_fish: { days: 4, fridge: 4, freezer: 20, into: rotten_flesh }
